<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organograma ICMBio – Sede</title>
<link rel="icon" type="image/png" href="./Designer_chico_mendes_icmbio_aquarela.png">
<style>
:root{--verde:#1b4d2b;--verde2:#4f8a5b;--verde3:#cfe3c8;--claro:#eef5ea;--amar:#fbefb8;--lil:#dcdcf0;--fio:#7a9a80;--sel:#d9822b;--txt:#17301f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:#f7faf5}
header{display:flex;align-items:center;gap:16px;padding:8px 14px;background:var(--verde);color:#fff}
h1{margin:0;font-size:1.05rem;font-weight:600;flex:1}
header button{font:inherit;min-width:36px;padding:4px 10px;border:1px solid #ffffff80;border-radius:6px;background:transparent;color:#fff;cursor:pointer}
header button:hover{background:#ffffff26}
/* @old: #view{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(#d5e2d0 1px,transparent 1px) 0 0/22px 22px} */
#view{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:#f7faf5;background-image:radial-gradient(#d5e2d080 1px,transparent 1px),linear-gradient(#f7faf5b8,#f7faf5b8),url("./Designer_chico_mendes_icmbio_aquarela.png");background-position:0 0,center,center;background-size:22px 22px,cover,cover;background-repeat:repeat,no-repeat,no-repeat}
#view.arr{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible}
#links path{fill:none;stroke:var(--fio);stroke-width:1.6}
#links path.anc{stroke:var(--sel);stroke-width:3}
.no{position:absolute;display:flex;flex-direction:column;justify-content:center;width:200px;height:50px;padding:4px 8px;border:1.5px solid var(--verde2);border-radius:8px;background:var(--claro);color:var(--txt);font:inherit;text-align:left;cursor:pointer}
.no b{font-size:13px}
.no span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.2}
.no:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.no.anc{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.no.sel{background:var(--sel);border-color:var(--sel);color:#fff}
.t-presidencia,.t-diretoria{background:var(--verde);border-color:var(--verde);color:#fff}
.t-cg{background:var(--verde3)}
.t-div,.t-serv,.t-setor{background:var(--amar);border-color:#d6c05f}
.t-centro{background:var(--lil);border-color:#9a9ac8}
.t-grupo{background:#fff;border-style:dashed}
.t-orgao{background:#e2eedd}
footer{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 14px;background:#fff;border-top:1px solid #cfdccb}
#caminho{flex:1 1 360px;min-width:0}
#legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
#legenda i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-2px;border:1.5px solid var(--verde2);border-radius:3px}

h1{flex:0 1 auto}
header{flex-wrap:wrap}
.busca{position:relative;flex:1 1 260px;max-width:560px}
.busca input{width:100%;padding:7px 10px;border:1px solid #ffffff80;border-radius:6px;font:inherit;color:var(--txt);background:#fff}
.busca input:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
#res{position:absolute;z-index:10;top:100%;left:0;right:0;max-height:60vh;margin:4px 0 0;padding:4px;overflow:auto;list-style:none;border-radius:8px;background:#fff;color:var(--txt);box-shadow:0 8px 24px #0003}
#res[hidden]{display:none}
#res li{padding:6px 8px;border-radius:6px;cursor:pointer}
#res li.on,#res li:hover{background:var(--verde3)}
#res li small{display:block;color:#5b705f;font-size:11px}
#res li.msg{cursor:default;color:#5b705f}
#res li.msg:hover{background:none}
#stage.voo{transition:transform .35s ease}
@media (prefers-reduced-motion:reduce){#stage.voo{transition:none}}
header button.modo{white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>Organograma ICMBio · Sede</h1>
  <div class="busca">
    <input id="q" type="search" placeholder="Buscar por sigla ou nome (ex.: CGGE ou Governança)" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="res" aria-label="Buscar unidade por sigla ou nome">
    <ul id="res" role="listbox" hidden></ul>
  </div>
  <button id="modo" type="button" class="modo"></button>
  <button id="mais" title="Aproximar" aria-label="Aproximar">+</button>
  <button id="menos" title="Afastar" aria-label="Afastar">−</button>
  <button id="ajusta" title="Mostrar tudo">Ver tudo</button>
</header>
<main id="view"><div id="stage"><svg id="links"></svg></div></main>
<footer>
  <div id="caminho" aria-live="polite">Pesquise por sigla ou nome, arraste para mover, use a roda do mouse para dar zoom e clique em um nó para ver o caminho até a Presidência.</div>
  <div id="legenda"></div>
</footer>
<script>
/* Os dados ficam em dados.json (mesma pasta). Para mudar a estrutura, edite apenas o JSON. */
function iniciar(DADOS) {

if (!DADOS || !DADOS.length){
  DADOS = retornaDadosEstrutura();
};

const W = 200, H = 50;          /* tamanho do nó */
const GXL = 20, GYL = 44;       /* entre blocos lado a lado / entre pai e filhos em linha */
const IND = 28, GYP = 8;        /* recuo e espaço dos filhos empilhados */
const LINHA = new Set(['presidencia', 'diretoria']); /* filhos lado a lado; os demais ficam empilhados abaixo do pai */
const view = document.getElementById('view'), stage = document.getElementById('stage'), svg = document.getElementById('links');
const NS = 'http://www.w3.org/2000/svg';
const rotulo = n => n.sigla || n.nome;

/* árvore */
const por = new Map(DADOS.map(n => [n.id, Object.assign({}, n, {f: []})]));
let raiz;
por.forEach(n => n.pai ? por.get(n.pai).f.push(n) : (raiz = n));

/* desenho: nós e fios são criados uma vez; as posições dependem do modo escolhido */
const botaoModo = document.getElementById('modo');
let modo = 'horizontal'; /* modo inicial: 'horizontal' (de cima para baixo) ou 'vertical' (da esquerda para a direita) */
let larg = 0, alt = 0, maxD = 0;
raiz.d = 0;
(function prof(n) { maxD = Math.max(maxD, n.d); n.f.forEach(c => { c.d = n.d + 1; prof(c); }); })(raiz);

por.forEach(n => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'no t-' + n.tipo;
  b.title = [n.sigla, n.nome].filter(Boolean).join(' – ');
  const s = document.createElement('b'); s.textContent = rotulo(n); b.appendChild(s);
  if (n.nome && n.nome !== n.sigla) { const t = document.createElement('span'); t.textContent = n.nome; b.appendChild(t); }
  b.addEventListener('click', () => { if (!arrastou) selecionar(n); });
  n.el = b; stage.appendChild(b);
  if (n.pai) { n.fio = document.createElementNS(NS, 'path'); svg.appendChild(n.fio); }
});

/* modo horizontal: Presidência e Diretorias abrem os filhos lado a lado; os demais níveis empilham abaixo do pai */
function layoutH() {
  function medir(n) {
    if (!n.f.length) return n.b = {w: W, h: H, soma: W};
    const bs = n.f.map(medir);
    if (LINHA.has(n.tipo)) {
      const soma = bs.reduce((a, b) => a + b.w, 0) + GXL * (bs.length - 1);
      return n.b = {w: Math.max(soma, W), h: H + GYL + Math.max(...bs.map(b => b.h)), soma};
    }
    return n.b = {w: Math.max(W, ...bs.map(b => IND + b.w)), h: bs.reduce((a, b) => a + GYP + b.h, H)};
  }
  function colocar(n, x, y) { /* (x, y) é o canto superior esquerdo do bloco */
    n.y = y;
    if (!n.f.length) { n.x = x; return; }
    if (LINHA.has(n.tipo)) {
      let cx = x + (n.b.w - n.b.soma) / 2;
      n.f.forEach(c => { colocar(c, cx, y + H + GYL); cx += c.b.w + GXL; });
      n.x = (n.f[0].x + n.f[n.f.length - 1].x) / 2;
    } else {
      n.x = x;
      let cy = y + H + GYP;
      n.f.forEach(c => { colocar(c, x + IND, cy); cy += c.b.h + GYP; });
    }
  }
  medir(raiz); colocar(raiz, 0, 0);
  return {w: raiz.b.w, h: raiz.b.h};
}

/* modo vertical: Presidência à esquerda, um nível por coluna */
const GXV = 56, GYV = 10;
function layoutV() {
  let folha = 0;
  (function pos(n) {
    n.x = n.d * (W + GXV);
    if (!n.f.length) { n.y = folha++ * (H + GYV); return; }
    n.f.forEach(pos);
    n.y = (n.f[0].y + n.f[n.f.length - 1].y) / 2;
  })(raiz);
  return {w: (maxD + 1) * (W + GXV) - GXV, h: folha * (H + GYV) - GYV};
}

function aplicarLayout() {
  const m = modo === 'horizontal' ? layoutH() : layoutV();
  larg = m.w; alt = m.h;
  svg.setAttribute('width', larg); svg.setAttribute('height', alt);
  por.forEach(n => {
    n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px';
    if (!n.fio) return;
    const p = por.get(n.pai);
    n.fio.setAttribute('d', modo === 'vertical'
      ? `M${p.x + W} ${p.y + H / 2} H${p.x + W + GXV / 2} V${n.y + H / 2} H${n.x}`
      : LINHA.has(p.tipo)
        ? `M${p.x + W / 2} ${p.y + H} V${p.y + H + GYL / 2} H${n.x + W / 2} V${n.y}`
        : `M${p.x + 12} ${p.y + H} V${n.y + H / 2} H${n.x}`);
  });
  botaoModo.textContent = modo === 'horizontal' ? 'Ver estrutura na vertical' : 'Ver estrutura na horizontal';
}
function alternar() { /* troca o modo mantendo o nó selecionado em foco */
  modo = modo === 'horizontal' ? 'vertical' : 'horizontal';
  aplicarLayout();
  if (atual) centrar(atual); else inicio();
}
botaoModo.addEventListener('click', alternar);
aplicarLayout();

/* seleção e caminho */
let marcados = [], atual = null;
function selecionar(n) {
  marcados.forEach(([el, c]) => el.classList.remove(c)); marcados = [];
  atual = n;
  const cadeia = [];
  for (let x = n; x; x = x.pai ? por.get(x.pai) : null) {
    cadeia.unshift(x);
    marcados.push([x.el, x === n ? 'sel' : 'anc']);
    x.el.classList.add(x === n ? 'sel' : 'anc');
    if (x.fio) { x.fio.classList.add('anc'); marcados.push([x.fio, 'anc']); }
  }
  document.getElementById('caminho').textContent = cadeia.map(rotulo).join(' › ');
}

/* zoom e arraste */
let k = 1, tx = 0, ty = 0, arrastou = false;
const aplicar = () => stage.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
function zoom(cx, cy, f) {
  const nk = Math.min(2, Math.max(0.05, k * f)), r = nk / k;
  tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r; k = nk; aplicar();
}
const centro = f => zoom(view.clientWidth / 2, view.clientHeight / 2, f);
view.addEventListener('wheel', e => {
  e.preventDefault();
  const r = view.getBoundingClientRect();
  zoom(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, {passive: false});

let ini = null;
view.addEventListener('pointerdown', e => { ini = {x: e.clientX, y: e.clientY, tx, ty}; arrastou = false; });
view.addEventListener('pointermove', e => {
  if (!ini) return;
  const dx = e.clientX - ini.x, dy = e.clientY - ini.y;
  if (!arrastou && Math.hypot(dx, dy) > 4) { arrastou = true; view.classList.add('arr'); view.setPointerCapture(e.pointerId); }
  if (arrastou) { tx = ini.tx + dx; ty = ini.ty + dy; aplicar(); }
});
const soltar = () => { ini = null; view.classList.remove('arr'); setTimeout(() => arrastou = false, 0); };
view.addEventListener('pointerup', soltar); view.addEventListener('pointercancel', soltar);

document.getElementById('mais').onclick = () => centro(1.25);
document.getElementById('menos').onclick = () => centro(1 / 1.25);
function verTudo() {
  k = Math.min(view.clientWidth / larg, view.clientHeight / alt, 1) * 0.95;
  tx = (view.clientWidth - larg * k) / 2; ty = (view.clientHeight - alt * k) / 2; aplicar();
}
document.getElementById('ajusta').onclick = verTudo;
function inicio() { /* abre legível, com a Presidência em destaque */
  if (modo === 'horizontal') { k = 0.6; tx = view.clientWidth / 2 - (raiz.x + W / 2) * k; ty = 24; }
  else { k = 0.7; tx = 24; ty = view.clientHeight / 2 - (raiz.y + H / 2) * k; }
  aplicar();
}
inicio();

/* busca */
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
por.forEach(n => {
  n.s = [n.sigla].concat(n.aliases || []).map(norm).filter(Boolean);
  n.n = norm(n.nome);
  n.h = n.s.join(' ') + ' ' + n.n;
});
const caminhoDe = n => { const c = []; for (let x = n.pai && por.get(n.pai); x; x = x.pai ? por.get(x.pai) : null) c.unshift(rotulo(x)); return c.join(' › '); };

function buscar(texto) {
  const q = norm(texto), tk = q.split(' ');
  if (!q) return [];
  const rank = n => n.s.includes(q) ? 0 : n.s.some(s => s.startsWith(q)) ? 1 : n.n.startsWith(q) ? 2 : n.s.some(s => s.includes(q)) ? 3 : n.n.includes(q) ? 4 : 5;
  return [...por.values()].filter(n => tk.every(t => n.h.includes(t)))
    .sort((a, b) => rank(a) - rank(b) || a.d - b.d || a.y - b.y);
}

const campo = document.getElementById('q'), lista = document.getElementById('res');
let achados = [], ativo = -1;
const fechar = () => { lista.hidden = true; campo.setAttribute('aria-expanded', 'false'); ativo = -1; };
function marcar(i) {
  const itens = lista.querySelectorAll('li[role=option]');
  itens.forEach((li, j) => li.classList.toggle('on', j === i));
  ativo = i;
  if (itens[i]) { itens[i].scrollIntoView({block: 'nearest'}); campo.setAttribute('aria-activedescendant', itens[i].id); }
}
function msg(texto) { const li = document.createElement('li'); li.className = 'msg'; li.textContent = texto; lista.appendChild(li); }
function mostrar() {
  lista.textContent = ''; ativo = -1;
  if (!norm(campo.value)) return fechar();
  achados = buscar(campo.value);
  if (!achados.length) msg('Nenhuma unidade encontrada. Tente outra sigla ou parte do nome.');
  achados.slice(0, 15).forEach((n, i) => {
    const li = document.createElement('li'); li.id = 'r' + i; li.setAttribute('role', 'option');
    const b = document.createElement('b'); b.textContent = rotulo(n); li.appendChild(b);
    if (n.nome && n.nome !== n.sigla) li.appendChild(document.createTextNode(' – ' + n.nome));
    const c = caminhoDe(n);
    if (c) { const s = document.createElement('small'); s.textContent = 'Dentro de: ' + c; li.appendChild(s); }
    li.addEventListener('mousedown', e => { e.preventDefault(); ir(n); });
    lista.appendChild(li);
  });
  if (achados.length > 15) msg('Mostrando 15 de ' + achados.length + ' resultados. Digite mais para refinar.');
  lista.hidden = false; campo.setAttribute('aria-expanded', 'true');
  if (achados.length) marcar(0);
}
function centrar(n) {
  stage.classList.add('voo');
  k = Math.max(k, 0.9); tx = view.clientWidth / 2 - (n.x + W / 2) * k; ty = view.clientHeight / 2 - (n.y + H / 2) * k; aplicar();
  setTimeout(() => stage.classList.remove('voo'), 400);
}
function ir(n) { /* seleciona, centraliza e fecha a lista */
  selecionar(n); fechar(); centrar(n);
}

/**
 * Abrir o arquivo HTML diretamente com file://, devido às restrições de segurança do navegador (política de mesma origem), 
 * o fetch pode falhar. Recomendado usar um servidor local (Live Server-vscode, http-server, ...).
 * Com isso essa função de retorno do JSON caso não funcinar na página.
*/
function retornaDadosEstrutura() {
  console.log("Dados buscados da função local.");
  const dados = [
    {"id": "presi", "pai": null, "sigla": "PRESI", "nome": "Presidência", "tipo": "presidencia"},
    {"id": "secet", "pai": "presi", "sigla": "SECET", "nome": "Secretaria Executiva da Comissão de Ética", "tipo": "orgao"},
    {"id": "pfe", "pai": "presi", "sigla": "PFE", "nome": "Procuradoria Federal Especializada", "tipo": "orgao"},
    {"id": "asspres", "pai": "presi", "sigla": "Assessoria do Presidente", "nome": "Assessoria do Presidente", "tipo": "orgao"},
    {"id": "corr", "pai": "presi", "sigla": "CORR", "nome": "Corregedoria", "tipo": "orgao"},
    {"id": "diap", "pai": "corr", "sigla": "DIAP", "nome": "Divisão de Atos e Procedimentos", "tipo": "div"},
    {"id": "daprev", "pai": "corr", "sigla": "DAPREV", "nome": "Divisão de Admissibilidade e Prevenção", "tipo": "div"},
    {"id": "audit", "pai": "presi", "sigla": "AUDIT", "nome": "Auditoria Interna", "tipo": "orgao"},
    {"id": "dpa", "pai": "audit", "sigla": "DPA", "nome": "Divisão de Processos de Auditoria", "tipo": "div"},
    {"id": "ouv", "pai": "presi", "sigla": "OUV", "nome": "Ouvidoria", "tipo": "orgao"},

    {"id": "gabin", "pai": "presi", "sigla": "GABIN", "nome": "Gabinete", "tipo": "orgao", "aliases": ["Gabinete da Presidência"]},
    {"id": "cga", "pai": "gabin", "sigla": "CGA", "nome": "Coordenação de Gestão Administrativa do Gabinete", "tipo": "coord"},
    {"id": "dpl", "pai": "gabin", "sigla": "DPL", "nome": "Divisão de Assuntos Parlamentares", "tipo": "div"},
    {"id": "dai", "pai": "gabin", "sigla": "DAI", "nome": "Divisão de Assuntos Internacionais", "tipo": "div"},

    {"id": "dpae", "pai": "cgge", "sigla": "DPAE", "nome": "Divisão de Planejamento e Avaliação da Estratégia", "tipo": "div"},
    {"id": "dinfo", "pai": "cgge", "sigla": "DINFO", "nome": "Divisão de Gestão da Informação Institucional", "tipo": "div"},
    {"id": "cgcs", "pai": "presi", "sigla": "CGCS", "nome": "Coordenação-Geral de Comunicação Social", "tipo": "cg"},
    {"id": "ccom", "pai": "cgcs", "sigla": "CCOM", "nome": "Coordenação de Comunicação Social", "tipo": "coord"},
    {"id": "disat", "pai": "presi", "sigla": "DISAT", "nome": "Diretoria de Ações Socioambientais e Consolidação Territorial em Unidades de Conservação", "tipo": "diretoria"},
    {"id": "diman", "pai": "presi", "sigla": "DIMAN", "nome": "Diretoria de Criação e Manejo de Unidades de Conservação", "tipo": "diretoria"},
    {"id": "dibio", "pai": "presi", "sigla": "DIBIO", "nome": "Diretoria de Pesquisa, Avaliação e Monitoramento da Biodiversidade", "tipo": "diretoria"},
    {"id": "diplan", "pai": "presi", "sigla": "DIPLAN", "nome": "Diretoria de Planejamento, Administração e Logística", "tipo": "diretoria"},
    {"id": "cotat", "pai": "disat", "sigla": "COTAT", "nome": "Coordenação de Assessoria Técnico e Administrativo", "tipo": "coord"},
    {"id": "dap-cotat", "pai": "cotat", "sigla": "DAP-COTAT", "nome": "Divisão de Apoio Técnico", "tipo": "div"},
    {"id": "cgpt", "pai": "disat", "sigla": "CGPT", "nome": "Coordenação-Geral de Articulação de Políticas Públicas e Economias da Sociobiodiversidade", "tipo": "cg"},
    {"id": "cobem", "pai": "cgpt", "sigla": "COBEM", "nome": "Coordenação de Informações para o Bem-Viver", "tipo": "coord"},
    {"id": "copact", "pai": "cgpt", "sigla": "COPACT", "nome": "Coordenação de Articulação de Políticas Públicas", "tipo": "coord", "aliases": ["COPCT"]},
    {"id": "coecos", "pai": "cgpt", "sigla": "COECOS", "nome": "Coordenação de Promoção das Economias da Sociobiodiversidade", "tipo": "coord"},
    {"id": "dimaco", "pai": "coecos", "sigla": "DIMACO", "nome": "Divisão de Manejo Florestal Comunitário", "tipo": "div"},
    {"id": "copesc", "pai": "cgpt", "sigla": "COPESC", "nome": "Coordenação de Pesca Artesanal", "tipo": "coord"},

campo.addEventListener('input', mostrar);
campo.addEventListener('focus', () => { if (campo.value) mostrar(); });
campo.addEventListener('keydown', e => {
  const total = Math.min(achados.length, 15);
  if (e.key === 'ArrowDown' && total) { e.preventDefault(); marcar((ativo + 1) % total); }
  else if (e.key === 'ArrowUp' && total) { e.preventDefault(); marcar((ativo - 1 + total) % total); }
  else if (e.key === 'Enter' && achados[ativo]) { e.preventDefault(); ir(achados[ativo]); }
  else if (e.key === 'Escape') { fechar(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.busca')) fechar(); });

/* legenda */
[['t-diretoria', 'Presidência / Diretoria'], ['t-cg', 'Coordenação-Geral'], ['t-coord', 'Coordenação'], ['t-div', 'Divisão, serviço ou setor'], ['t-centro', 'Centro']]
  .forEach(([c, t]) => {
    const s = document.createElement('span'), i = document.createElement('i');
    i.className = c; i.style.background = getComputedStyle(document.documentElement).getPropertyValue(
      {'t-diretoria': '--verde', 't-cg': '--verde3', 't-coord': '--claro', 't-div': '--amar', 't-centro': '--lil'}[c]);
    s.appendChild(i); s.appendChild(document.createTextNode(t)); document.getElementById('legenda').appendChild(s);
  });
}
/* Busca dos dados da estrutura no JSON */
fetch('dados.json', {cache: 'no-cache'})
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(iniciar)
  .catch(e => {
    document.getElementById('caminho').textContent = 'Não foi possível carregar o dados.json (' + e.message + '). ' +
      'Publique o site (ex.: GitHub Pages) ou abra por um servidor local, pois o navegador bloqueia a leitura de arquivos locais.';
  });
